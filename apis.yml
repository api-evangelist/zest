name: Zest
description: >-
  Zest Equity is a DIFC/ADGM-based provider of digital infrastructure for
  private-market transactions across the Middle East and North Africa. Its
  SPV-as-a-Service (SPaaS) platform lets partners create Cayman/DIFC Special
  Purpose Vehicles, run FSRA-regulated escrow, and arrange private capital
  deals. The Zest Public API gives partners programmatic access to the core
  workflow: OAuth 2.0 JWT-Bearer authentication, contract-validated SPV creation
  requests, bulk investor onboarding, subscription processing (signed forms +
  funding receipts), and nine HMAC-SHA256-signed webhook lifecycle events, with
  Idempotency-Key support on write endpoints and a uniform error envelope.
